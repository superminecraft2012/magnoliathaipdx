[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/menu/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Orphan crawlable files. Netlify serves these at 200 and they duplicate the
# rendered menu, so they compete with the page that should rank. Left reachable
# rather than deleted, in case a link to one was ever texted or QR-coded —
# see the open question in SEO.md.
[[headers]]
  for = "/menu/Magnolia_Menu.md"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/menu/*.HEIC"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thai-magnolia-assets/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/order"
  to = "https://www.toasttab.com/local/order/magnoliathaipdx"
  status = 302
  force = true
